[workspace]
members = [
  "crates/l2linkscope-core",
  "crates/l2linkscope-protocols",
  "crates/l2linkscope-linux",
  "crates/l2linkscope-cli",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/hmblprogrammer/l2linkscope"

[workspace.lints.rust]
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unwrap_used = "deny"
