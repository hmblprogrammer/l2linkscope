name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2

      - name: Install declared Rust toolchain
        run: rustup show

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - name: Run workspace checks
        run: scripts/check.sh

      - name: Verify publication remains opt-in
        shell: bash
        run: |
          for manifest in crates/*/Cargo.toml; do
            if ! grep -q '^publish = false$' "$manifest"; then
              echo "::error file=$manifest::package publication must remain explicitly disabled"
              exit 1
            fi
          done

      - name: Validate package metadata and contents
        shell: bash
        run: |
          for manifest in crates/*/Cargo.toml; do
            cargo package --locked --list --manifest-path "$manifest" >/dev/null
          done
