name: Security

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "24 11 * * 2"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  committed-secrets:
    name: committed-secrets
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # gitleaks-action v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-security:
    name: dependency-security
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # actions/checkout v4.2.2

      - name: Install declared Rust toolchain
        run: rustup show

      - name: Install stable Rust for security tools
        run: rustup toolchain install stable --profile minimal

      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --locked --version 0.22.2

      - name: Install cargo-deny
        run: cargo +stable install cargo-deny --locked --version 0.20.2

      - name: Audit Rust dependencies
        run: cargo +stable audit --deny warnings

      - name: Check dependency policy
        run: cargo +stable deny check advisories licenses bans sources
